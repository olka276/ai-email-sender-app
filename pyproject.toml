[project]
name = "ai-email-sender-app"
version = "0.1.0"
description = "AI agent that classifies messages and routes them to the right department by e-mail"
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.1.0",
    "aiosmtplib>=3.0.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "ollama>=0.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.30.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false
