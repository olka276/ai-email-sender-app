services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_engine
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD-SHELL", "ollama list || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama_model_loader
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c", "ollama pull $${OLLAMA_MODEL}" ]
    restart: "no"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog_server
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  api:
    build: .
    container_name: ai_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama_data: