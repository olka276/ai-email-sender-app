services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_engine
    volumes:
      - ./ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_THREAD=${OLLAMA_NUM_THREAD:-10}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        rm -f /tmp/model_ready
        ollama serve &
        server_pid=$$!
        trap 'kill $$server_pid' TERM INT
        until ollama list > /dev/null 2>&1; do sleep 1; done
        echo "1. Downloading model weights: $${OLLAMA_MODEL}..."
        ollama pull "$${OLLAMA_MODEL}"
        echo "2. Model warmup..."
        ollama run "$${OLLAMA_MODEL}" "ok" > /dev/null
        touch /tmp/model_ready
        echo "3. Model ready!"
        wait $$server_pid
    healthcheck:
      # healthy == model downloaded and warmed up
      test: [ "CMD-SHELL", "test -f /tmp/model_ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30m
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog_server
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    restart: unless-stopped

  api:
    build: .
    container_name: ai_api
    ports:
      - "${API_PORT:-8000}:8000"
    # Application settings (see .env.example) come from .env; defaults live in app/config.py.
    env_file:
      - path: .env
        required: false
    environment:
      # Shared with the ollama service, so both always use the same model.
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      ollama:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped
