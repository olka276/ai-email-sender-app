services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_engine
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_THREAD=10
    healthcheck:
      test: [ "CMD-SHELL", "ollama list || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama_model_loader
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "1. Downloading model weights: $${OLLAMA_MODEL}..."
        ollama pull $${OLLAMA_MODEL}
        echo "2. Model warmup..."
        ollama run $${OLLAMA_MODEL} "ok" --keepalive 15m > /dev/null
        echo "3. Model ready!"
    restart: "no"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog_server
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  api:
    build: .
    container_name: ai_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama_data: